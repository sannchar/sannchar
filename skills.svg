<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="My skills have no limits">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF5"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f43f9e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="240" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="238" rx="17" fill="none" stroke="#30363d"/>

  <!-- background sparkles -->
  <g fill="#36BCF5" opacity="0.6">
    <circle cx="70" cy="50" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="190" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="60" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="195" r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="25" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- infinity sign -->
  <path id="inf" pathLength="700" fill="none" stroke="#2a3140" stroke-width="10" stroke-linecap="round"
        d="M400,85 C340,25 250,25 250,85 C250,145 340,145 400,85 C460,25 550,25 550,85 C550,145 460,145 400,85 Z"/>
  <path pathLength="700" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="190 510" filter="url(#glow)"
        d="M400,85 C340,25 250,25 250,85 C250,145 340,145 400,85 C460,25 550,25 550,85 C550,145 460,145 400,85 Z">
    <animate attributeName="stroke-dashoffset" from="0" to="-700" dur="4s" repeatCount="indefinite"/>
  </path>
  <path pathLength="700" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="190 510" stroke-dashoffset="-350" filter="url(#glow)"
        d="M400,85 C340,25 250,25 250,85 C250,145 340,145 400,85 C460,25 550,25 550,85 C550,145 460,145 400,85 Z">
    <animate attributeName="stroke-dashoffset" from="-350" to="-1050" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <text x="400" y="190" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="24" font-weight="700" fill="url(#neon)" letter-spacing="3">
    SKILLS WITHOUT LIMITS
  </text>
  <text x="400" y="217" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#8b949e" letter-spacing="2">
    always learning · always building · never stopping
  </text>
</svg>
